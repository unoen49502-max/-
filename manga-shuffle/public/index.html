<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>漫画シャッフル</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="progress"><span id="progress-bar"></span></div>

<main id="stage">
  <section id="card" class="card" hidden>
    <div class="card-media"><img id="card-image" alt="" referrerpolicy="no-referrer"></div>
    <div class="card-body">
      <div class="badges" id="card-badges"></div>
      <h1 id="card-title"></h1>
      <p id="card-summary"></p>
      <div class="meta">
        <span id="card-source"></span>
        <span id="card-popularity"></span>
        <span id="card-date"></span>
      </div>
      <a id="card-link" class="open-link" target="_blank" rel="noopener noreferrer">元のページを開く ↗</a>
    </div>
  </section>

  <section id="tweet" class="tweet" hidden>
    <div class="badges" id="tweet-badges"></div>
    <div id="tweet-mount"></div>
    <a id="tweet-link" class="open-link" target="_blank" rel="noopener noreferrer">X で開く ↗</a>
  </section>

  <section id="empty" class="empty" hidden>
    <h1>まだ候補がありません</h1>
    <p id="empty-detail">「更新」を押すと各ソースから集め直します。</p>
    <button id="empty-refresh" class="btn">いま集める</button>
  </section>
</main>

<footer id="controls">
  <button class="btn" id="btn-prev" title="前へ (←)">◀</button>
  <button class="btn" id="btn-pause" title="一時停止 (Space)">⏸</button>
  <button class="btn" id="btn-next" title="次へ (→)">▶</button>
  <button class="btn" id="btn-fav" title="お気に入り (F)">☆</button>
  <button class="btn" id="btn-skip" title="興味なし (X)">✕</button>
  <label class="seconds">
    <input id="seconds" type="range" min="10" max="180" step="5">
    <span id="seconds-label"></span>
  </label>
  <button class="btn" id="btn-refresh" title="集め直す (R)">⟳</button>
  <button class="btn" id="btn-stats" title="ジャンル統計 (S)">▤</button>
</footer>

<aside id="stats" class="panel" hidden>
  <header>
    <h2>ジャンルの偏り</h2>
    <button class="btn ghost" id="stats-close">✕</button>
  </header>
  <p class="panel-note" id="stats-summary"></p>
  <div id="stats-bars"></div>
  <div class="panel-actions">
    <button class="btn ghost" id="btn-reset-history">表示履歴をリセット</button>
  </div>
  <pre id="stats-logs"></pre>
</aside>

<div id="toast" hidden></div>
<script src="/app.js" type="module"></script>
</body>
</html>
