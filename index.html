<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>デスクトップマスコット</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="character" class="facing-right state-idle">
    <div class="bubble" id="bubble"></div>
    <div class="zzz">💤</div>
    <div class="cat">
      <div class="tail"></div>
      <div class="leg leg-back"></div>
      <div class="leg leg-front"></div>
      <div class="body">
        <div class="ear ear-l"></div>
        <div class="ear ear-r"></div>
        <div class="face">
          <div class="eye eye-l"></div>
          <div class="eye eye-r"></div>
          <div class="cheek cheek-l"></div>
          <div class="cheek cheek-r"></div>
          <div class="mouth"></div>
        </div>
        <div class="belly"></div>
      </div>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
