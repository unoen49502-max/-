<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>メイのドット工房</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-screen" aria-hidden="true"></div>

  <main class="app">
    <!-- ===== セレクト画面（工房の壁） ===== -->
    <section id="select-screen" class="screen">
      <header class="titlebar"><h1 class="title">メイのドット工房</h1></header>

      <div class="greeter">
        <div class="cam-frame cam-sm">
          <div class="cam-inner">
            <div class="cam-circle"><div class="cam-face js-face face-neutral" aria-hidden="true"></div></div>
            <div class="cam-ovl" aria-hidden="true"></div>
          </div>
          <span class="cam-name">はぐれメイ</span>
        </div>
        <div class="speech-panel">
          <span class="speech-name">はぐれメイ</span>
          <span class="speech-text js-speech">すきな えを えらんでね♦</span>
        </div>
      </div>

      <h2 class="screen-heading">こうぼうの かべ</h2>
      <div id="puzzle-list" class="puzzle-list"></div>
    </section>

    <!-- ===== ゲーム画面（配信オーバーレイ・スマホ主軸） ===== -->
    <section id="game-screen" class="screen hidden">
      <!-- ヘッダー -->
      <div class="game-header">
        <span class="gh-title">メイのドット工房</span>
        <span class="gh-status">
          <span class="live-badge"><span class="live-dot"></span>LIVE</span>
          <span class="timer" id="timer">00:00</span>
        </span>
      </div>

      <!-- キャラ帯 -->
      <div class="char-band">
        <div class="cam-frame cam-band">
          <div class="cam-inner">
            <div class="cam-circle"><div class="cam-face js-face face-neutral" aria-hidden="true"></div></div>
            <div class="cam-ovl" aria-hidden="true"></div>
          </div>
          <span class="cam-name">はぐれメイ</span>
        </div>
        <div class="band-info">
          <div class="speech-panel">
            <span class="speech-name">はぐれメイ</span>
            <span class="speech-text js-speech">いっしょに かこうね♦</span>
          </div>
          <div class="progress">
            <span class="puzzle-name" id="puzzle-name">-</span>
            <div class="progress-track"><div class="progress-bar" id="progress-bar"></div></div>
            <span class="progress-pct" id="progress-pct">0%</span>
          </div>
        </div>
      </div>

      <!-- メインパネル -->
      <div class="main-panel">
        <span class="spark spark-tl" aria-hidden="true"></span>
        <span class="spark spark-br" aria-hidden="true"></span>
        <div class="board-plate">
          <div class="board-wrap"><div id="board" class="board"></div></div>
        </div>
      </div>

      <!-- 下部固定ボタン帯 -->
      <div class="toolbar-bar">
        <div class="toolbar">
          <button id="mode-fill" class="btn mode-btn active">■ ぬる</button>
          <button id="mode-mark" class="btn mode-btn">✕ マーク</button>
          <button id="reset-btn" class="btn btn-warn">やりなおし</button>
        </div>
        <div class="tool-foot">
          <button id="back-btn" class="btn btn-small back-btn">＜ かべへ</button>
          <span class="hint">ながおし で ✕マーク</span>
        </div>
      </div>
    </section>

    <!-- ===== クリア演出 ===== -->
    <div id="clear-overlay" class="overlay hidden">
      <div class="clear-box">
        <div id="clear-face" class="face face-happy big-face" aria-hidden="true"></div>
        <h2 class="clear-title">かんせい！</h2>
        <div id="clear-art" class="clear-art"></div>
        <p class="clear-msg">かべに かざったよ！</p>
        <p id="clear-time" class="clear-time">TIME 00:00</p>
        <button id="clear-next" class="btn">つぎへ</button>
      </div>
      <div id="confetti" class="confetti" aria-hidden="true"></div>
    </div>
  </main>

  <script src="puzzles.js"></script>
  <script src="game.js"></script>
</body>
</html>
