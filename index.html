/* ---------------- 入力 ---------------- */
const keys={}, pressed={};
const KEYMAP={arrowup:'up',w:'up',arrowdown:'down',s:'down',arrowleft:'left',a:'left',
  arrowright:'right',d:'right',z:'atk',' ':'atk',x:'act',enter:'start',m:'mute'};
addEventListener('keydown',e=>{
  const k=KEYMAP[e.key.toLowerCase()]; if(!k)return;
  e.preventDefault(); if(!keys[k])pressed[k]=true; keys[k]=true; initAudio();
});
addEventListener('keyup',e=>{const k=KEYMAP[e.key.toLowerCase()]; if(k)keys[k]=false;});
document.querySelectorAll('.pbtn[data-k]').forEach(el=>{
  const k=KEYMAP[el.dataset.k.toLowerCase()];
  const dn=e=>{e.preventDefault(); if(!keys[k])pressed[k]=true; keys[k]=true; initAudio();};
  const up=e=>{e.preventDefault(); keys[k]=false;};
  el.addEventListener('pointerdown',dn); el.addEventListener('pointerup',up);
  el.addEventListener('pointerleave',up); el.addEventListener('pointercancel',up);
});

/* ---------------- サウンド (WebAudio・オリジナル曲) ---------------- */
let AC=null, muted=false, musicOn=true;
function initAudio(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } if(AC&&AC.state==='suspended')AC.resume(); }
function tone(freq,dur,type='square',vol=0.05,when=0,slide=0){
  if(!AC||muted)return;
  const t=AC.currentTime+when, o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur+0.02);
}
const mf=m=>440*Math.pow(2,(m-69)/12);
const SFX={
  sword(){tone(520,0.09,'square',0.05,0,-320);},
  hit(){tone(180,0.07,'square',0.06,0,-60);},
  die(){tone(300,0.06,'square',0.05,0,-150);tone(180,0.08,'square',0.05,0.05,-100);},
  hurt(){tone(120,0.22,'sawtooth',0.07,0,-60);},
  gem(){tone(mf(88),0.06,'square',0.045);tone(mf(93),0.09,'square',0.045,0.06);},
  heart(){tone(mf(76),0.07,'triangle',0.08);tone(mf(83),0.12,'triangle',0.08,0.07);},
  key(){[72,76,79,84].forEach((n,i)=>tone(mf(n),0.09,'square',0.05,i*0.08));},
  unlock(){tone(mf(60),0.1,'square',0.06);tone(mf(67),0.16,'square',0.06,0.1);},
  blip(){tone(mf(84),0.03,'square',0.025);},
  bossHurt(){tone(90,0.18,'sawtooth',0.08,0,-40);},
  warp(){tone(mf(72),0.07,'triangle',0.07,0,120);tone(mf(60),0.2,'triangle',0.07,0.08,-100);},
  fanfare(){[64,67,71,76,79,83,88].forEach((n,i)=>tone(mf(n),0.16,'square',0.05,i*0.11));
            [40,47,52].forEach((n,i)=>tone(mf(n),0.5,'triangle',0.08,i*0.22));},
};
/* オリジナルBGM(自作の短いループ) lead:[midi,steps] bass:2stepごと */
const MUSIC={
  over:{step:0.21,
    lead:[[69,2],[72,1],[76,1],[74,2],[72,2],[71,2],[67,1],[71,1],[74,4],
          [72,2],[76,1],[79,1],[77,2],[76,2],[74,2],[71,1],[67,1],[69,4]],

          [56,2],[59,2],[63,2],[62,2],[57,2],[60,2],[64,2],[69,2]],
    bass:[33,33,32,32,29,29,31,31,33,33,29,29,31,31,33,33]},
  boss:{step:0.15,
    lead:[[69,1],[69,1],[72,1],[69,1],[68,1],[68,1],[71,1],[68,1],
          [67,1],[67,1],[70,1],[67,1],[71,1],[71,1],[74,1],[75,1]],
    bass:[33,33,32,32,31,31,35,35]},
};
let musTrack='over', musNext=0, musLeadI=0, musBassI=0, musLeadWait=0;
function updateMusic(){
  if(!AC||muted||!musicOn)return;
  const M=MUSIC[musTrack]; if(!M)return;
  while(musNext<AC.currentTime+0.25){
    if(musNext<AC.currentTime-1){musNext=AC.currentTime;}
    const when=Math.max(0,musNext-AC.currentTime);
    if(musLeadWait<=0){
      const [n,len]=M.lead[musLeadI%M.lead.length];
      tone(mf(n),M.step*len*0.9,'square',0.028,when);
      musLeadWait=len; musLeadI++;
    }
    if(musBassI%2===0){
      const b=M.bass[(musBassI/2)%M.bass.length];
      tone(mf(b),M.step*1.8,'triangle',0.05,when);
    }
    musLeadWait--; musBassI++; musNext+=M.step;
  }
}
function setTrack(t){ if(musTrack!==t){musTrack=t; musLeadI=0;musBassI=0;musLeadWait=0;} }

/* ---------------- スプライト生成 ---------------- */
function makeSprite(pal,rows,scale=1){
  const h=rows.length, w=Math.max(...rows.map(r=>r.length));
  const c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
  const g=c.getContext('2d');
  for(let y=0;y<h;y++)for(let x=0;x<rows[y].length;x++){
    const ch=rows[y][x]; if(ch==='.'||ch===' ')continue;
    g.fillStyle=pal[ch]||'#f0f'; g.fillRect(x*scale,y*scale,scale,scale);
  }
  return c;
}
function flipH(img){
  const c=document.createElement('canvas'); c.width=img.width; c.height=img.height;
  const g=c.getContext('2d'); g.translate(img.width,0); g.scale(-1,1); g.drawImage(img,0,0);
  return c;
}

function makeTile(fn){ const c=document.createElement('canvas'); c.width=TILE; c.height=TILE;
  fn(c.getContext('2d')); return c; }
function grassBase(g,shade){ g.fillStyle=shade?'#3a944a':'#3f9e4f'; g.fillRect(0,0,16,16);
  g.fillStyle='#33823f';[[2,3],[9,1],[13,6],[5,10],[11,12],[1,13],[7,7],[14,14]].forEach(([x,y])=>g.fillRect(x,y,2,1)); }

/* ---------------- ゲーム状態 ---------------- */
let state='title', frame=0, fade=0, introPage=0, shake=0;
let flags={}; // key, doorOpen, bossDead, chestOpen
const player={x:0,y:0,dir:'down',hp:6,maxHp:6,gems:0,keys:0,crystals:0,
  atkT:0,invT:0,kb:{x:0,y:0,t:0},anim:0,moving:false};
let scr={area:'over',col:0,row:1};   // 村からスタート
let enemies=[], drops=[], effects=[], bolts=[], boss=null;
let dialog=null; // {lines:[], line:0, chars:0, name}
let areaLabel='', areaLabelT=0;

function mapOf(s=scr){return AREAS[s.area].screens[s.col+','+s.row];}
function tileAt(px,py,s=scr){
  const tx=Math.floor(px/TILE), ty=Math.floor(py/TILE);
  if(tx<0||ty<0||tx>=COLS||ty>=ROWS)return '#';
  return mapOf(s)[ty][tx];
}
function solidAt(px,py){return SOLID.has(tileAt(px,py));}
function boxFree(x,y,w,h){
  return !solidAt(x,y)&&!solidAt(x+w-1,y)&&!solidAt(x,y+h-1)&&!solidAt(x+w-1,y+h-1);
}

function enterScreen(area,col,row,px,py,dir){
  scr={area,col,row};
  player.x=px; player.y=py; if(dir)player.dir=dir;
  enemies=[]; drops=[]; bolts=[]; effects=[]; boss=null;
  const key=`${area}:${col},${row}`;
  (SPAWNS[key]||[]).forEach(sp=>{
    if(area==='dun'&&key==='dun:0,1'&&flags.midCleared)return;
    enemies.push(makeEnemy(sp.t,sp.x*16,sp.y*16));
  });
  if(key==='dun:0,0'&&!flags.bossDead){
    boss={x:LW/2-12,y:44,hp:12,maxHp:12,t:0,tpT:120,shootT:60,frame:0,flash:0};
    mapOf()[13][7]='S'; mapOf()[13][8]='S';
    setTrack('boss');
  } else if(key==='dun:0,0'&&flags.bossDead){
    mapOf()[13][7]='f'; mapOf()[13][8]='f';
  }
  if(area==='dun'&&flags.doorOpen){AREAS.dun.screens['0,1'][0][7]='f';AREAS.dun.screens['0,1'][0][8]='f';}
  setTrack(boss?'boss':area==='dun'?'dun':'over');
  const nm=AREA_NAMES[key]; if(nm&&nm!==areaLabel){areaLabel=nm; areaLabelT=110;}
  else if(nm){areaLabel=nm;}
}

function makeEnemy(t,x,y){
  const base={t,x,y,vx:0,vy:0,think:0,flash:0,hitId:-1};
  if(t==='slime')return {...base,hp:1,spd:0.35,dmg:1};
  if(t==='bat')  return {...base,hp:1,spd:0.8,dmg:1,ang:Math.random()*6.28};
  if(t==='skel') return {...base,hp:2,spd:0.6,dmg:2};
  return base;
}

/* ---------------- 会話 ---------------- */
function startDialog(lines,name){ dialog={lines,line:0,chars:0,name:name||''}; }
function updateDialog(){
  const cur=dialog.lines[dialog.line];
  if(dialog.chars<cur.length){ dialog.chars+=1; if(dialog.chars%3===0)SFX.blip(); }
  if(pressed.atk||pressed.act||pressed.start){
    if(dialog.chars<cur.length)dialog.chars=cur.length;
    else{ dialog.line++; dialog.chars=0;
      if(dialog.line>=dialog.lines.length)dialog=null; }
  }
}

/* ---------------- プレイヤー更新 ---------------- */
function updatePlayer(){
  const spd=1.4;
  let dx=0,dy=0;
  if(player.kb.t>0){ dx=player.kb.x; dy=player.kb.y; player.kb.t--; }
  else if(player.atkT<=0){
    if(keys.up){dy=-spd;player.dir='up';}
    else if(keys.down){dy=spd;player.dir='down';}
    if(keys.left){dx=-spd;player.dir='left';}
    else if(keys.right){dx=spd;player.dir='right';}
  }
  player.moving=(dx||dy);
  if(player.moving)player.anim++;
  // 当たり判定ボックス(足元 12x10)
  const bw=12,bh=10, ox=2, oy=6;
  let nx=player.x+dx;
  if(boxFree(nx+ox,player.y+oy,bw,bh))player.x=nx;
  let ny=player.y+dy;
  if(boxFree(player.x+ox,ny+oy,bw,bh))player.y=ny;

  // 画面遷移
  const A=AREAS[scr.area];
  if(player.x<-4&&scr.col>0)enterScreen(scr.area,scr.col-1,scr.row,LW-16,player.y);
  else if(player.x>LW-12&&scr.col<A.w-1)enterScreen(scr.area,scr.col+1,scr.row,0,player.y);
  else if(player.y<-4&&scr.row>0)enterScreen(scr.area,scr.col,scr.row-1,player.x,LH-18);
  else if(player.y>LH-12&&scr.row<A.h-1)enterScreen(scr.area,scr.col,scr.row+1,player.x,2);
  player.x=Math.max(-4,Math.min(LW-12,player.x));
  player.y=Math.max(-4,Math.min(LH-12,player.y));

  // ワープタイル
  const cx=player.x+8, cy=player.y+11;
  const t=tileAt(cx,cy);
  if(t==='C'){ SFX.warp(); enterScreen('dun',0,2,LW/2-8,10*16,'up'); return; }
  if(t==='E'){ SFX.warp(); enterScreen('over',2,1,8*16-8,4*16+2,'down'); return; }

  // 鍵の扉
  const fx=cx+(player.dir==='left'?-12:player.dir==='right'?12:0);
  const fy=cy+(player.dir==='up'?-12:player.dir==='down'?10:0);
  if(tileAt(fx,fy)==='L'&&player.moving){
    if(player.keys>0){
      player.keys--; flags.doorOpen=true; SFX.unlock();
      AREAS.dun.screens['0,1'][0][7]='f'; AREAS.dun.screens['0,1'][0][8]='f';
      startDialog(['小さな鍵を使った!\n扉が重々しく開いた……。']);
    } else if(!player._lmsg||frame-player._lmsg>90){
      player._lmsg=frame; startDialog(['扉には鍵穴がある。\n小さな鍵が必要のようだ。']);
    }
  }

  // 攻撃
  if(pressed.atk&&player.atkT<=0){
    player.atkT=14; player.swingId=(player.swingId||0)+1; SFX.sword();
    // 草を切る
    const bx=Math.floor(fx/TILE), by=Math.floor(fy/TILE);
    if(scr.area==='over'&&mapOf()[by]&&mapOf()[by][bx]==='B'){
      mapOf()[by][bx]='.'; puff(bx*16+8,by*16+8);
      const r=Math.random();
      if(r<0.22)drops.push({t:'heart',x:bx*16+4,y:by*16+4,ttl:600});
      else if(r<0.55)drops.push({t:'gem',x:bx*16+4,y:by*16+4,ttl:600});
    }
  }
  if(player.atkT>0)player.atkT--;
  if(player.invT>0)player.invT--;

  // 話しかける
  if(pressed.act){
    const list=NPCS[`${scr.area}:${scr.col},${scr.row}`]||[];
    for(const n of list){
      if(Math.abs(n.x-player.x)<20&&Math.abs(n.y-player.y)<22){
        startDialog(n.lines,n.name); break;
      }
    }
    // 宝箱
    if(scr.area==='dun'&&scr.row===1&&!flags.chestOpen){
      if(Math.abs(player.x-32)<22&&Math.abs(player.y-32)<24){
        flags.chestOpen=true; player.keys++; SFX.key();
        startDialog(['宝箱をあけた!\n「小さな鍵」を手に入れた!']);
      }
    }
  }
}
function swordBox(){
  const cx=player.x+8, cy=player.y+8;
  switch(player.dir){
    case 'up':return {x:cx-6,y:cy-18,w:12,h:14};
    case 'down':return {x:cx-6,y:cy+4,w:12,h:14};
    case 'left':return {x:cx-18,y:cy-6,w:14,h:12};
    case 'right':return {x:cx+4,y:cy-6,w:14,h:12};
  }
}
function rectHit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function hurtPlayer(dmg,srcX,srcY){
  if(player.invT>0)return;
  player.hp-=dmg; player.invT=60; SFX.hurt(); shake=6;
  const d=Math.hypot(player.x-srcX,player.y-srcY)||1;
  player.kb={x:(player.x-srcX)/d*2.6,y:(player.y-srcY)/d*2.6,t:10};
  if(player.hp<=0){ state='gameover'; fade=0; }
}
function puff(x,y){effects.push({x,y,t:0});}

/* ---------------- 敵更新 ---------------- */
function updateEnemies(){
  const sb=player.atkT>6?swordBox():null;
  for(const e of enemies){
    if(e.flash>0)e.flash--;
    if(e.t==='slime'){
      if(--e.think<=0){e.think=40+Math.random()*50;
        const a=Math.floor(Math.random()*5);
        e.vx=[0,1,-1,0,0][a]*e.spd; e.vy=[0,0,0,1,-1][a]*e.spd;}
      tryMove(e);
    } else if(e.t==='bat'){
      e.ang+=(Math.random()-0.5)*0.4;
      e.vx=Math.cos(e.ang)*e.spd; e.vy=Math.sin(e.ang)*e.spd;
      e.x+=e.vx; e.y+=e.vy;
      if(e.x<4||e.x>LW-20){e.ang=Math.PI-e.ang;e.x=Math.max(4,Math.min(LW-20,e.x));}
      if(e.y<4||e.y>LH-20){e.ang=-e.ang;e.y=Math.max(4,Math.min(LH-20,e.y));}
    } else if(e.t==='skel'){
      const dx=player.x-e.x, dy=player.y-e.y, d=Math.hypot(dx,dy);
      if(d<96){ e.vx=dx/d*e.spd; e.vy=dy/d*e.spd; }
      else if(--e.think<=0){e.think=50+Math.random()*40;
        const a=Math.floor(Math.random()*5);
        e.vx=[0,1,-1,0,0][a]*0.4; e.vy=[0,0,0,1,-1][a]*0.4;}
      tryMove(e);
    }
    // 剣ヒット
    const eb={x:e.x+2,y:e.y+2,w:12,h:12};
    if(sb&&e.hitId!==player.swingId&&rectHit(sb,eb)){
      e.hitId=player.swingId; e.hp--; e.flash=8; SFX.hit();
      const d=Math.hypot(e.x-player.x,e.y-player.y)||1;
      e.x+=(e.x-player.x)/d*8; e.y+=(e.y-player.y)/d*8;
      if(e.hp<=0){
        e.dead=true; SFX.die(); puff(e.x+8,e.y+8);
        const r=Math.random();
        if(r<0.25)drops.push({t:'heart',x:e.x+4,y:e.y+4,ttl:600});
        else if(r<0.6)drops.push({t:'gem',x:e.x+4,y:e.y+4,ttl:600});
      }
    }
    // 接触ダメージ
    const pb={x:player.x+2,y:player.y+4,w:12,h:11};
    if(!e.dead&&rectHit(pb,eb))hurtPlayer(e.dmg,e.x,e.y);
  }
  enemies=enemies.filter(e=>!e.dead);
  if(scr.area==='dun'&&scr.row===1&&enemies.length===0)flags.midCleared=true;
}
function tryMove(e){
  const nx=e.x+e.vx, ny=e.y+e.vy;
  if(boxFree(nx+2,e.y+4,12,10))e.x=nx; else e.vx=-e.vx;
  if(boxFree(e.x+2,ny+4,12,10))e.y=ny; else e.vy=-e.vy;
}

/* ---------------- ボス ---------------- */
function updateBoss(){
  if(!boss)return;
  boss.t++;
  if(boss.flash>0)boss.flash--;
  if(--boss.tpT<=0){ // 瞬間移動
    boss.tpT=110+Math.random()*70;
    puff(boss.x+12,boss.y+12);
    boss.x=24+Math.random()*(LW-72); boss.y=28+Math.random()*90;
    puff(boss.x+12,boss.y+12);
  }
  if(--boss.shootT<=0){ // 3方向の闇の弾
    boss.shootT=80;
    const cx=boss.x+12, cy=boss.y+16;
    const base=Math.atan2(player.y+8-cy,player.x+8-cx);
    for(const off of [-0.35,0,0.35]){
      bolts.push({x:cx,y:cy,vx:Math.cos(base+off)*1.7,vy:Math.sin(base+off)*1.7,t:0});
    }
    tone(140,0.15,'sawtooth',0.05,0,-60);
  }
  // 剣ヒット
  const sb=player.atkT>6?swordBox():null;
  const bb={x:boss.x+4,y:boss.y+4,w:16,h:18};
  if(sb&&boss.hitId!==player.swingId&&rectHit(sb,bb)){
    boss.hitId=player.swingId; boss.hp--; boss.flash=10; SFX.bossHurt(); shake=4;
    if(boss.hp<=0){
      flags.bossDead=true; SFX.fanfare(); shake=12;
      for(let i=0;i<8;i++)puff(boss.x+Math.random()*24,boss.y+Math.random()*24);
      drops.push({t:'crystal',x:LW/2-8,y:LH/2-24,ttl:99999});
      mapOf()[13][7]='f'; mapOf()[13][8]='f';
      boss=null; setTrack('dun');
      return;
    }
  }
  const pb={x:player.x+2,y:player.y+4,w:12,h:11};
  if(rectHit(pb,bb))hurtPlayer(2,boss.x+8,boss.y+8);
  // 弾
  for(const b of bolts){
    b.x+=b.vx; b.y+=b.vy; b.t++;
    if(rectHit(pb,{x:b.x-3,y:b.y-3,w:6,h:6})){b.dead=true;hurtPlayer(2,b.x,b.y);}
    if(b.x<0||b.x>LW||b.y<0||b.y>LH||b.t>300)b.dead=true;
  }
  bolts=bolts.filter(b=>!b.dead);
}

/* ---------------- ドロップ ---------------- */
function updateDrops(){
  const pb={x:player.x+2,y:player.y+4,w:12,h:11};
  for(const d of drops){
    d.ttl--;
    if(d.ttl<=0){d.dead=true;continue;}
    if(rectHit(pb,{x:d.x,y:d.y,w:d.t==='crystal'?16:8,h:d.t==='crystal'?16:8})){
      d.dead=true;
      if(d.t==='heart'){player.hp=Math.min(player.maxHp,player.hp+2);SFX.heart();}
      else if(d.t==='gem'){player.gems++;SFX.gem();}
      else if(d.t==='crystal'){player.crystals++;state='ending';fade=0;introPage=0;}
    }
  }
  drops=drops.filter(d=>!d.dead);
  for(const e of effects){e.t++;} effects=effects.filter(e=>e.t<20);
}

/* ---------------- 描画 ---------------- */
function drawMap(){
  const m=mapOf(), wf=Math.floor(frame/24)%2;
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    let t=m[y][x];
    let img;
    if(t==='W')img=tileCache[wf?'W2':'W'];
    else if(t==='.')img=tileCache[(x+y)%2?'.':'.2'];
    else img=tileCache[t]||tileCache['.'];
    // 地面が必要なタイルは下地を描く
    if('TBR'.includes(t))ctx.drawImage(tileCache['.'],x*16,y*16);
    if(t==='C')ctx.drawImage(tileCache['R'],x*16,y*16);
    ctx.drawImage(img,x*16,y*16);
  }
}
function drawSword(){
  if(player.atkT<=0)return;
  const p=player.atkT/14; // 1→0
  ctx.save();
  ctx.translate(player.x+8,player.y+9);
  const steel='#d8dce8', hilt='#e8c84a';
  ctx.fillStyle=steel;
  if(player.dir==='down'){ctx.fillRect(-1,6,3,11);ctx.fillStyle=hilt;ctx.fillRect(-3,6,7,2);}
  if(player.dir==='up'){ctx.fillRect(-1,-17,3,11);ctx.fillStyle=hilt;ctx.fillRect(-3,-8,7,2);}
  if(player.dir==='right'){ctx.fillRect(6,-1,11,3);ctx.fillStyle=hilt;ctx.fillRect(6,-3,2,7);}
  if(player.dir==='left'){ctx.fillRect(-17,-1,11,3);ctx.fillStyle=hilt;ctx.fillRect(-8,-3,2,7);}
  if(p>0.6){ctx.fillStyle='rgba(255,255,255,0.5)';
    const r=18*(1-p)+8; ctx.fillRect(-r/2,-r/2,r,1);}
  ctx.restore();
}
function drawEntities(){
  // NPC
  (NPCS[`${scr.area}:${scr.col},${scr.row}`]||[]).forEach(n=>{
    ctx.drawImage(n.spr,n.x,n.y);
  });
  // 宝箱
  if(scr.area==='dun'&&scr.row===1)
    ctx.drawImage(flags.chestOpen?chestOpen:chestClosed,32,24);
  // ドロップ
  const bob=Math.sin(frame/10)*1.5;
  for(const d of drops){
    if(d.ttl<120&&Math.floor(frame/4)%2)continue;
    if(d.t==='heart')ctx.drawImage(heartSpr,d.x,d.y+bob*0.5);
    else if(d.t==='gem')ctx.drawImage(gemSpr,d.x,d.y+bob*0.5);
    else if(d.t==='crystal'){
      ctx.fillStyle='rgba(122,216,255,0.25)';
      ctx.beginPath();ctx.arc(d.x+8,d.y+8+bob,12+Math.sin(frame/8)*2,0,6.29);ctx.fill();
      ctx.drawImage(crystalSpr,d.x,d.y+bob);
    }
  }
  // 敵
  const f2=Math.floor(frame/12)%2;
  for(const e of enemies){
    if(e.flash>0&&Math.floor(frame/2)%2)continue;
    const img=e.t==='slime'?(f2?slimeB:slimeA):e.t==='bat'?(f2?batB:batA):(f2?skelB:skelA);
    ctx.drawImage(img,Math.round(e.x),Math.round(e.y));
  }
  // ボス
  if(boss){
    if(!(boss.flash>0&&Math.floor(frame/2)%2)){
      ctx.fillStyle='rgba(120,40,200,0.18)';
      ctx.beginPath();ctx.arc(boss.x+12,boss.y+14,17+Math.sin(frame/7)*2,0,6.29);ctx.fill();
      ctx.drawImage(Math.floor(frame/14)%2?bossB:bossA,Math.round(boss.x),Math.round(boss.y));
    }
  }
  for(const b of bolts){
    ctx.fillStyle=b.t%6<3?'#8a3adf':'#c060ff';
    ctx.fillRect(b.x-3,b.y-3,6,6);
    ctx.fillStyle='#2a1040';ctx.fillRect(b.x-1,b.y-1,3,3);
  }
  // プレイヤー
  if(!(player.invT>0&&Math.floor(frame/3)%2)){
    const fr=player.moving?Math.floor(player.anim/8)%2:0;
    ctx.drawImage(HERO_SPR[player.dir][fr],Math.round(player.x),Math.round(player.y));
  }
  drawSword();
  // エフェクト
  for(const e of effects){
    const r=e.t*0.9+2;
    ctx.fillStyle=`rgba(240,240,255,${1-e.t/20})`;
    ctx.fillRect(e.x-r,e.y-1,r*0.6,2);ctx.fillRect(e.x+r*0.4,e.y-1,r*0.6,2);
    ctx.fillRect(e.x-1,e.y-r,2,r*0.6);ctx.fillRect(e.x-1,e.y+r*0.4,2,r*0.6);
  }
}

/* ---- 表示側(テキストは高解像度で) ---- */
function blit(){
  let sx=0, sy=0;
  if(shake>0){sx=(Math.random()-0.5)*shake;sy=(Math.random()-0.5)*shake;shake*=0.85;if(shake<0.5)shake=0;}
  dctx.fillStyle='#000'; dctx.fillRect(0,0,cv.width,cv.height);
  dctx.imageSmoothingEnabled=false;
  dctx.drawImage(buf,sx*SCALE,sy*SCALE,LW*SCALE,LH*SCALE);
}
function dtext(str,x,y,px,color='#fff',align='left',bold=true){
  dctx.font=`${bold?'bold ':''}${px}px 'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif`;
  dctx.textAlign=align; dctx.textBaseline='top';
  dctx.fillStyle='rgba(0,0,0,0.6)'; dctx.fillText(str,x+2,y+2);
  dctx.fillStyle=color; dctx.fillText(str,x,y);
}
function drawHUD(){
  dctx.fillStyle='rgba(8,8,18,0.55)'; dctx.fillRect(0,0,cv.width,44);
  // ハート
  for(let i=0;i<player.maxHp/2;i++){
    const hx=14+i*34, hy=8;
    const v=player.hp-i*2; // 2:満タン 1:半分
    dctx.save(); dctx.translate(hx,hy); dctx.scale(3.5,3.5);
    dctx.drawImage(heartSpr,0,0);
    if(v<2){ dctx.fillStyle='rgba(20,20,30,0.82)';
      dctx.fillRect(v===1?4:0,0,v===1?4:8,8); }
    dctx.restore();
  }
  // ジェム・鍵・クリスタル
  dctx.save(); dctx.translate(cv.width-190,8); dctx.scale(3.5,3.5); dctx.drawImage(gemSpr,0,0); dctx.restore();
  dtext('×'+player.gems,cv.width-155,12,22);
  if(player.keys>0){ dctx.save(); dctx.translate(cv.width-90,8); dctx.scale(3.5,3.5); dctx.drawImage(keySpr,0,0); dctx.restore();
    dtext('×'+player.keys,cv.width-55,12,22); }
  if(areaLabelT>0){
    areaLabelT--;
    const a=Math.min(1,areaLabelT/30);
    dctx.globalAlpha=a;
    dtext(areaLabel,cv.width/2,54,26,'#ffe9a0','center');
    dctx.globalAlpha=1;
  }
  if(boss){
    const w=300, x=cv.width/2-w/2, y=cv.height-40;
    dctx.fillStyle='rgba(0,0,0,0.6)'; dctx.fillRect(x-4,y-4,w+8,22);
    dctx.fillStyle='#521'; dctx.fillRect(x,y,w,14);
    dctx.fillStyle='#c22a4a'; dctx.fillRect(x,y,w*boss.hp/boss.maxHp,14);
    dtext('ヴォルグの影',x,y-26,18,'#e8b0ff');
  }
}
function drawDialogBox(){
  if(!dialog)return;
  const bx=30, bw=cv.width-60, bh=150, by=cv.height-bh-24;
  dctx.fillStyle='rgba(10,10,26,0.92)'; dctx.fillRect(bx,by,bw,bh);
  dctx.strokeStyle='#e8e0c0'; dctx.lineWidth=3; dctx.strokeRect(bx+4,by+4,bw-8,bh-8);
  let yy=by+16;
  if(dialog.name){ dtext('【'+dialog.name+'】',bx+20,yy,20,'#ffe9a0'); yy+=30; }
  const shown=dialog.lines[dialog.line].slice(0,dialog.chars).split('\n');
  shown.forEach((ln,i)=>dtext(ln,bx+20,yy+i*30,22));
  if(dialog.chars>=dialog.lines[dialog.line].length&&Math.floor(frame/20)%2)
    dtext('▼',bx+bw-40,by+bh-34,20,'#ffe9a0');
}

/* ---------------- タイトル・イントロ・エンディング ---------------- */
const INTRO_PAGES=[
'エルドラ王国は 天空より落ちた\n聖なる宝玉「光晶(こうしょう)」の\n加護に守られていた。',
'だが 月なき夜――\n影の魔導士ヴォルグが神殿を襲い、\n光晶は三つに砕け散った。',
'加護を失った大地に\n魔物があふれ始める。\n\n草原の村オルムに住む若き剣士が\n今、旅立ちの朝を迎える。',
'その名は―― アレン。',
];
function drawTitle(){
  dctx.fillStyle='#0a0a1e'; dctx.fillRect(0,0,cv.width,cv.height);
  // 星
  for(let i=0;i<40;i++){
    const x=(i*97)%cv.width, y=(i*211)%Math.floor(cv.height*0.7);
    dctx.fillStyle=(i+Math.floor(frame/30))%5?'#334':'#aac';
    dctx.fillRect(x,y,2,2);
  }
  // クリスタル
  dctx.save();
  dctx.translate(cv.width/2-8*4,150+Math.sin(frame/40)*6); dctx.scale(5,5);
  dctx.drawImage(crystalSpr,0,0); dctx.restore();
  dctx.fillStyle=`rgba(122,216,255,${0.10+0.05*Math.sin(frame/20)})`;
  dctx.beginPath(); dctx.arc(cv.width/2,190,80,0,6.29); dctx.fill();
  dtext('クリスタル・オブ・エルドラ',cv.width/2,270,44,'#dceaff','center');
  dtext('- CRYSTAL OF ELDRA -',cv.width/2,325,20,'#8aa0d0','center');
  dtext('体験版 / DEMO',cv.width/2,365,18,'#8aa0d0','center');
  if(Math.floor(frame/30)%2)
    dtext('PRESS ENTER',cv.width/2,440,26,'#ffe9a0','center');
  dtext('移動:矢印/WASD  剣:Z  話す:X  サウンド:M',cv.width/2,510,17,'#667','center');
  dtext('オリジナル作品 — ジャンルへのオマージュとして制作',cv.width/2,610,15,'#556','center');
}
function drawIntro(){
  dctx.fillStyle='#050510'; dctx.fillRect(0,0,cv.width,cv.height);
  const lines=INTRO_PAGES[introPage].split('\n');
  lines.forEach((ln,i)=>dtext(ln,cv.width/2,220+i*44,26,'#cfd6ea','center'));
  if(Math.floor(frame/30)%2)
    dtext('▼ Z / ENTER',cv.width/2,560,18,'#667','center');
}
function drawGameOver(){
  fade=Math.min(1,fade+0.02);
  dctx.fillStyle=`rgba(40,0,0,${fade*0.85})`; dctx.fillRect(0,0,cv.width,cv.height);
  if(fade>0.5){
    dtext('GAME OVER',cv.width/2,260,52,'#c22a3a','center');
    dtext('アレンは倒れてしまった……',cv.width/2,340,22,'#caa','center');
    if(Math.floor(frame/30)%2)dtext('ENTER でタイトルへ',cv.width/2,430,20,'#877','center');
  }
}
function drawEnding(){
  fade=Math.min(1,fade+0.01);
  dctx.fillStyle='#050512'; dctx.fillRect(0,0,cv.width,cv.height);
  dctx.globalAlpha=fade;
  dctx.save(); dctx.translate(cv.width/2-8*4,120+Math.sin(frame/40)*5); dctx.scale(5,5);
  dctx.drawImage(crystalSpr,0,0); dctx.restore();
  const lines=['光晶のかけらを 取り戻した!','','だが かけらは まだ二つ、','闇の中に眠っている……。','','アレンの旅は 始まったばかり。'];
  lines.forEach((ln,i)=>dtext(ln,cv.width/2,270+i*36,24,'#dce4ff','center'));
  dtext('THE END — DEMO VERSION',cv.width/2,530,22,'#ffe9a0','center');
  if(fade>=1&&Math.floor(frame/30)%2)dtext('ENTER でタイトルへ',cv.width/2,590,18,'#667','center');
  dctx.globalAlpha=1;
}

/* ---------------- リセット ---------------- */
function resetGame(){
  flags={};
  Object.assign(player,{hp:6,maxHp:6,gems:0,keys:0,crystals:0,atkT:0,invT:0,anim:0,dir:'down'});
  player.kb={x:0,y:0,t:0};
  // マップの復元(草・扉・封印)
  buildMapsFresh();
  enterScreen('over',0,1,7*16+4,11*16,'up');
}
const ORIG_SCREENS=JSON.parse(JSON.stringify({over:AREAS.over.screens,dun:AREAS.dun.screens}));
function buildMapsFresh(){
  for(const a in ORIG_SCREENS)for(const k in ORIG_SCREENS[a])
    AREAS[a].screens[k]=ORIG_SCREENS[a][k].map(r=>r.slice());
}

/* ---------------- メインループ ---------------- */
function update(){
  frame++;
  if(state==='title'){
    if(pressed.start||pressed.atk){ state='intro'; introPage=0; SFX.gem(); }
  } else if(state==='intro'){
    if(pressed.start||pressed.atk){
      introPage++; SFX.blip();
      if(introPage>=INTRO_PAGES.length){ resetGame(); state='play'; }
    }
  } else if(state==='play'){
    if(dialog)updateDialog();
    else{
      updatePlayer();
      if(state!=='play'){/* died */}
      else{ updateEnemies(); updateBoss(); updateDrops(); }
    }
    updateMusic();
  } else if(state==='gameover'){
    if(fade>0.5&&(pressed.start)){ state='title'; fade=0; }
  } else if(state==='ending'){
    updateMusic(); setTrack('over');
    if(fade>=1&&pressed.start){ state='title'; fade=0; }
  }
  if(pressed.mute){ muted=!muted; }
  for(const k in pressed)pressed[k]=false;
}
function render(){
  if(state==='title'){ drawTitle(); return; }
  if(state==='intro'){ drawIntro(); return; }
  if(state==='ending'){ drawEnding(); return; }
  // play / gameover は世界を描く
  ctx.fillStyle='#000'; ctx.fillRect(0,0,LW,LH);
  drawMap(); drawEntities();
  blit(); drawHUD(); drawDialogBox();
  if(state==='gameover')drawGameOver();
}
function loop(){ update(); render(); requestAnimationFrame(loop); }
loop();
</script>
