  const k=KEYMAP[e.key.toLowerCase()]; if(!k)return;
  e.preventDefault(); if(!keys[k])pressed[k]=true; keys[k]=true; initAudio();

  el.addEventListener('pointerdown',dn); el.addEventListener('pointerup',up);

});

/* ---------------- サウンド (WebAudio・オリジナル曲) ---------------- */
let AC=null, muted=false, musicOn=true;
function initAudio(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } if(AC&&AC.state==='suspended')AC.resume(); }
function tone(freq,dur,type='square',vol=0.05,when=0,slide=0){
  if(!AC||muted)return;
  const t=AC.currentTime+when, o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur+0.02);
}

  hurt(){tone(120,0.22,'sawtooth',0.07,0,-60);},

  heart(){tone(mf(76),0.07,'triangle',0.08);tone(mf(83),0.12,'triangle',0.08,0.07);},

let musTrack='over', musNext=0, musLeadI=0, musBassI=0, musLeadWait=0;
function updateMusic(){
  if(!AC||muted||!musicOn)return;
  const Mu=MUSIC[musTrack]; if(!Mu)return;
  while(musNext<AC.currentTime+0.25){
    if(musNext<AC.currentTime-1){musNext=AC.currentTime;}
    const when=Math.max(0,musNext-AC.currentTime);
    if(musLeadWait<=0){
      const pair=Mu.lead[musLeadI%Mu.lead.length];
      tone(mf(pair[0]),Mu.step*pair[1]*0.9,'square',0.028,when);
      musLeadWait=pair[1]; musLeadI++;
    }
    if(musBassI%2===0){
      const bn=Mu.bass[(musBassI/2)%Mu.bass.length];
      tone(mf(bn),Mu.step*1.8,'triangle',0.05,when);
    }
    musLeadWait--; musBassI++; musNext+=Mu.step;
  }
}
function setTrack(t){ if(musTrack!==t){musTrack=t; musLeadI=0;musBassI=0;musLeadWait=0;} }

/* ---------------- スプライト生成 ---------------- */
function makeSprite(pal,rows,scale=1){
  const h=rows.length, w=Math.max(...rows.map(r=>r.length));
  const c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
  const g=c.getContext('2d');
  for(let y=0;y<h;y++)for(let x=0;x<rows[y].length;x++){
    const ch=rows[y][x]; if(ch==='.'||ch===' ')continue;
    g.fillStyle=pal[ch]||'#f0f'; g.fillRect(x*scale,y*scale,scale,scale);
  }
  return c;
}
function flipH(img){
  const c=document.createElement('canvas'); c.width=img.width; c.height=img.height;
  const g=c.getContext('2d'); g.translate(img.width,0); g.scale(-1,1); g.drawImage(img,0,0);
  return c;
}

const tileCache={};
function makeTile(fn){ const c=document.createElement('canvas'); c.width=TILE; c.height=TILE;
  fn(c.getContext('2d')); return c; }
function grassBase(g,shade){ g.fillStyle=shade?'#3a944a':'#3f9e4f'; g.fillRect(0,0,16,16);
  g.fillStyle='#33823f';[[2,3],[9,1],[13,6],[5,10],[11,12],[1,13],[7,7],[14,14]].forEach(p=>g.fillRect(p[0],p[1],2,1)); }
function buildTiles(){
  tileCache['.']=makeTile(g=>grassBase(g,0));
  tileCache['.2']=makeTile(g=>grassBase(g,1));
  tileCache[',']=makeTile(g=>{grassBase(g,0); g.fillStyle='#e8e058'; g.fillRect(5,4,2,2);
    g.fillStyle='#e83a4a'; g.fillRect(11,10,2,2); g.fillStyle='#f0f0ff'; g.fillRect(3,11,2,2);
    g.fillStyle='#f0a8e0'; g.fillRect(10,3,2,2);});
  // 背の高い草(歩ける・切れる) 2フレーム
  const tg=sw=>makeTile(g=>{grassBase(g,0);
    g.fillStyle='#2e7d38';
    const bl=[[2,10],[5,7],[8,11],[11,8],[13,10],[4,12],[9,6]];
    bl.forEach((p,i)=>{const dx=(i%2)?(sw?1:0):(sw?0:1);
      g.fillRect(p[0]+dx,p[1],2,16-p[1]);});
    g.fillStyle='#57c46a';
    bl.forEach((p,i)=>{const dx=(i%2)?(sw?1:0):(sw?0:1); g.fillRect(p[0]+dx,p[1],1,2);});});
  tileCache['v']=tg(0); tileCache['v2']=tg(1);
  tileCache['s']=makeTile(g=>{g.fillStyle='#d8b878'; g.fillRect(0,0,16,16); g.fillStyle='#c4a462';
    [[3,2],[10,5],[6,9],[13,12],[1,7],[8,14]].forEach(p=>g.fillRect(p[0],p[1],2,2));});
  tileCache['T']=makeTile(g=>{grassBase(g,0); g.fillStyle='#4a2e14'; g.fillRect(7,11,3,5);
    g.fillStyle='#1e6e2e'; g.beginPath(); g.arc(8,6,6.5,0,6.29); g.fill();
    g.fillStyle='#2e8e40'; g.beginPath(); g.arc(6,5,4,0,6.29); g.fill();
    g.fillStyle='#46b458'; g.fillRect(4,3,3,2); g.fillRect(9,6,2,2);

function mapOf(s){s=s||scr; return AREAS[s.area].screens[s.col+','+s.row];}
function tileAt(px,py){
  const tx=Math.floor(px/TILE), ty=Math.floor(py/TILE);
  if(tx<0||ty<0||tx>=COLS||ty>=ROWS)return '#';
  return mapOf()[ty][tx];
}
function solidAt(px,py){return SOLID.has(tileAt(px,py));}
function boxFree(x,y,w,h){
  return !solidAt(x,y)&&!solidAt(x+w-1,y)&&!solidAt(x,y+h-1)&&!solidAt(x+w-1,y+h-1);
}

/* オーバーワールドの端を自動配線
   ・端はすべて境界タイルで封鎖
   ・隣接画面がある方向は、四隅を残して広く開放(どこからでも隣へ渡れる) */
function wireArea(area){
  const A=AREAS[area];
  for(const key in A.screens){
    const parts=key.split(','), c=+parts[0], r=+parts[1], m=A.screens[key];
    const bd=m[0][0];
    for(let x=0;x<COLS;x++){ m[0][x]=bd; m[ROWS-1][x]=bd; }
    for(let y=0;y<ROWS;y++){ m[y][0]=bd; m[y][COLS-1]=bd; }
    if(A.screens[c+','+(r-1)])for(let x=2;x<=COLS-3;x++)m[0][x]='.';
    if(A.screens[c+','+(r+1)])for(let x=2;x<=COLS-3;x++)m[ROWS-1][x]='.';
    if(A.screens[(c-1)+','+r])for(let y=2;y<=ROWS-3;y++)m[y][0]='.';
    if(A.screens[(c+1)+','+r])for(let y=2;y<=ROWS-3;y++)m[y][COLS-1]='.';
  }
}
/* 入場時に壁へめり込んでいたら、近くの歩ける場所へずらす */
function spawnSafe(){
  const ox=2,oy=6,bw=12,bh=10;
  if(boxFree(player.x+ox,player.y+oy,bw,bh))return;
  for(let rad=1;rad<=8;rad++)for(let dy=-rad;dy<=rad;dy++)for(let dx=-rad;dx<=rad;dx++){
    const nx=player.x+dx*8, ny=player.y+dy*8;
    if(nx>=-4&&nx<=LW-12&&ny>=-4&&ny<=LH-12&&boxFree(nx+ox,ny+oy,bw,bh)){player.x=nx;player.y=ny;return;}
  }
}

function enterScreen(area,col,row,px,py,dir){
  scr={area,col,row};
  player.x=px; player.y=py; if(dir)player.dir=dir;
  enemies=[]; drops=[]; bolts=[]; effects=[]; boss=null;
  const key=area+':'+col+','+row;
  (SPAWNS[key]||[]).forEach(sp=>{
    if(key==='dun:0,1'&&flags.midCleared)return;
    enemies.push(makeEnemy(sp.t,sp.x*16,sp.y*16));
  });
  if(area==='dun'&&flags.doorOpen){AREAS.dun.screens['0,1'][0][7]='f';AREAS.dun.screens['0,1'][0][8]='f';}
  if(key==='dun:0,0'&&!flags.bossDead){
    boss={x:LW/2-12,y:44,hp:14,maxHp:14,t:0,tpT:120,shootT:70,frame:0,flash:0};
    mapOf()[13][7]='S'; mapOf()[13][8]='S'; setTrack('boss');
  } else if(key==='dun:0,0'&&flags.bossDead){ mapOf()[13][7]='f'; mapOf()[13][8]='f'; }
  setTrack(boss?'boss':area==='dun'?'dun':'over');
  spawnSafe();
  const nm=AREA_NAMES[key]; if(nm){ areaLabel=nm; areaLabelT=110; }
}

function makeEnemy(t,x,y){
  const base={t,x,y,vx:0,vy:0,think:0,flash:0,hitId:-1};
  if(t==='slime')return Object.assign(base,{hp:1,spd:0.35,dmg:1});
  if(t==='bat')  return Object.assign(base,{hp:1,spd:0.8,dmg:1,ang:frame*0.7%6.28});
  if(t==='skel') return Object.assign(base,{hp:2,spd:0.62,dmg:2});
  return base;
}

}

/* ---------------- プレイヤー更新 ---------------- */
function adj(tx,ty){ return Math.abs(tx-player.x)<20 && Math.abs(ty-player.y)<22; }

function interact(){
  const key=scr.area+':'+scr.col+','+scr.row;
  for(const n of (NPCS[key]||[])) if(adj(n.x,n.y)){
    if(n.onTalk==='heal'&&player.hp<player.maxHp){player.hp=player.maxHp;SFX.heart();}
    startDialog(n.lines,n.name); return true;
  }
  for(const s of (SIGNS[key]||[])) if(adj(s.tx*16,s.ty*16)){ startDialog([s.text]); return true; }
  const cs=CHESTS[key]||[];
  for(let i=0;i<cs.length;i++){ const c=cs[i], id=key+'#'+i;
    if(!chestOpened.has(id)&&adj(c.tx*16,c.ty*16)){ openChest(id,c); return true; } }
  return false;
}
function openChest(id,c){
  chestOpened.add(id);
  if(c.item==='key'){player.keys++;SFX.key();startDialog(['宝箱をあけた!\n「小さな鍵」を手に入れた!']);}
  else if(c.item==='hc'){player.maxHp+=2;player.hp=player.maxHp;SFX.fanfare();
    startDialog(['大きな器を手に入れた!\nハートの最大値が ふえた!']);}
  else if(c.item==='gems'){player.gems+=5;SFX.gem();startDialog(['宝箱をあけた!\n宝石を 5つ 手に入れた!']);}
}

function updatePlayer(){
  const spd=1.4;
  let dx=0,dy=0;
  if(player.kb.t>0){ dx=player.kb.x; dy=player.kb.y; player.kb.t--; }
  else if(player.atkT<=0){
    if(keys.up){dy=-spd;player.dir='up';}
    else if(keys.down){dy=spd;player.dir='down';}
    if(keys.left){dx=-spd;player.dir='left';}
    else if(keys.right){dx=spd;player.dir='right';}
  }
  player.moving=!!(dx||dy);
  if(player.moving)player.anim++;
  const bw=12,bh=10, ox=2, oy=6;
  let nx=player.x+dx;
  if(boxFree(nx+ox,player.y+oy,bw,bh))player.x=nx;
  let ny=player.y+dy;
  if(boxFree(player.x+ox,ny+oy,bw,bh))player.y=ny;

  // 画面遷移(端に押し込むと発火。洞窟だけは門=列7,8を通る)
  if(!slide&&player.kb.t<=0){
    const cx=player.x+8, cy=player.y+8;
    const tcol=Math.floor(cx/16), A=AREAS[scr.area], dun=scr.area==='dun';
    const vg=!dun||GC.indexOf(tcol)>=0;
    if(keys.left&&cx<12&&scr.col>0)
      startSlide('left',scr.col-1,scr.row,(COLS-2)*16,player.y);
    else if(keys.right&&cx>LW-12&&scr.col<A.w-1)
      startSlide('right',scr.col+1,scr.row,20,player.y);
    else if(keys.up&&cy<12&&scr.row>0&&vg)
      startSlide('up',scr.col,scr.row-1,player.x,(ROWS-2)*16);
    else if(keys.down&&cy>LH-12&&scr.row<A.h-1&&vg)
      startSlide('down',scr.col,scr.row+1,player.x,20);
    if(slide)return;
  }

  // ワープ(洞窟の出入り)
  const t=tileAt(player.x+8,player.y+11);
  if(t==='C'){ SFX.warp(); enterScreen('dun',0,2,7*16,10*16,'up'); return; }
  if(t==='E'){ SFX.warp(); enterScreen('over',2,1,3*16,5*16,'down'); return; }

  // 前方タイル
  const cx=player.x+8, cy=player.y+11;
  const fx=cx+(player.dir==='left'?-12:player.dir==='right'?12:0);
  const fy=cy+(player.dir==='up'?-12:player.dir==='down'?10:0);

  // 鍵の扉
  if(tileAt(fx,fy)==='L'&&player.moving){
    if(player.keys>0){
      player.keys--; flags.doorOpen=true; SFX.unlock();
      mapOf()[0][7]='f'; mapOf()[0][8]='f';
      startDialog(['小さな鍵を使った!\n扉が重々しく開いた……。']);
    } else if(!player._lmsg||frame-player._lmsg>90){
      player._lmsg=frame; startDialog(['扉には鍵穴がある。\n小さな鍵が必要のようだ。']);
    }
  }

  // 攻撃
  if(pressed.atk&&player.atkT<=0){
    player.atkT=14; player.swingId++; SFX.sword();
    const bx=Math.floor(fx/TILE), by=Math.floor(fy/TILE), m=mapOf();
    if(m[by]&&(m[by][bx]==='B'||m[by][bx]==='v')){
      const wasBush=m[by][bx]==='B';
      m[by][bx]='.'; puff(bx*16+8,by*16+8);
      const rr=Math.random();
      if(rr<(wasBush?0.28:0.16))drops.push({t:'heart',x:bx*16+4,y:by*16+4,ttl:600});
      else if(rr<(wasBush?0.6:0.45))drops.push({t:'gem',x:bx*16+4,y:by*16+4,ttl:600});
    }
  }
  if(player.atkT>0)player.atkT--;
  if(player.invT>0)player.invT--;

  if(pressed.act)interact();
}
function swordBox(){
  const cx=player.x+8, cy=player.y+8;
  switch(player.dir){
    case 'up':return {x:cx-6,y:cy-18,w:12,h:14};
    case 'down':return {x:cx-6,y:cy+4,w:12,h:14};
    case 'left':return {x:cx-18,y:cy-6,w:14,h:12};
    default:return {x:cx+4,y:cy-6,w:14,h:12};
  }
}
function rectHit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function hurtPlayer(dmg,srcX,srcY){
  if(player.invT>0)return;
  player.hp-=dmg; player.invT=60; SFX.hurt(); shake=6;
  const d=Math.hypot(player.x-srcX,player.y-srcY)||1;
  player.kb={x:(player.x-srcX)/d*2.6,y:(player.y-srcY)/d*2.6,t:10};
  if(player.hp<=0){ state='gameover'; fade=0; }
}
function puff(x,y){effects.push({x,y,t:0});}

/* ---------------- 敵更新 ---------------- */
function updateEnemies(){
  const sb=player.atkT>6?swordBox():null;
  for(const e of enemies){
    if(e.flash>0)e.flash--;
    if(e.t==='slime'){
      if(--e.think<=0){e.think=40+Math.random()*50;
        const a=Math.floor(Math.random()*5);
        e.vx=[0,1,-1,0,0][a]*e.spd; e.vy=[0,0,0,1,-1][a]*e.spd;}
      tryMove(e);
    } else if(e.t==='bat'){
      e.ang+=(Math.random()-0.5)*0.4;
      e.vx=Math.cos(e.ang)*e.spd; e.vy=Math.sin(e.ang)*e.spd;
      e.x+=e.vx; e.y+=e.vy;
      if(e.x<20||e.x>LW-36){e.ang=Math.PI-e.ang;e.x=Math.max(20,Math.min(LW-36,e.x));}
      if(e.y<20||e.y>LH-36){e.ang=-e.ang;e.y=Math.max(20,Math.min(LH-36,e.y));}
    } else if(e.t==='skel'){
      const dx=player.x-e.x, dy=player.y-e.y, d=Math.hypot(dx,dy);
      if(d<96){ e.vx=dx/d*e.spd; e.vy=dy/d*e.spd; }
      else if(--e.think<=0){e.think=50+Math.random()*40;
        const a=Math.floor(Math.random()*5);
        e.vx=[0,1,-1,0,0][a]*0.4; e.vy=[0,0,0,1,-1][a]*0.4;}
      tryMove(e);
    }
    const eb={x:e.x+2,y:e.y+2,w:12,h:12};
    if(sb&&e.hitId!==player.swingId&&rectHit(sb,eb)){
      e.hitId=player.swingId; e.hp--; e.flash=8; SFX.hit();
      const d=Math.hypot(e.x-player.x,e.y-player.y)||1;
      e.x+=(e.x-player.x)/d*8; e.y+=(e.y-player.y)/d*8;
      if(e.hp<=0){
        e.dead=true; SFX.die(); puff(e.x+8,e.y+8);
        const rr=Math.random();
        if(rr<0.25)drops.push({t:'heart',x:e.x+4,y:e.y+4,ttl:600});
        else if(rr<0.6)drops.push({t:'gem',x:e.x+4,y:e.y+4,ttl:600});
      }
    }
    const pb={x:player.x+2,y:player.y+4,w:12,h:11};
    if(!e.dead&&rectHit(pb,eb))hurtPlayer(e.dmg,e.x,e.y);
  }
  enemies=enemies.filter(e=>!e.dead);
  if(scr.area==='dun'&&scr.row===1&&enemies.length===0)flags.midCleared=true;
}
function tryMove(e){
  const nx=e.x+e.vx, ny=e.y+e.vy;
  if(boxFree(nx+2,e.y+4,12,10))e.x=nx; else e.vx=-e.vx;
  if(boxFree(e.x+2,ny+4,12,10))e.y=ny; else e.vy=-e.vy;
}

/* ---------------- ボス ---------------- */
function updateBoss(){
  if(!boss)return;
  boss.t++;
  if(boss.flash>0)boss.flash--;
  if(--boss.tpT<=0){
    boss.tpT=110+Math.random()*70; puff(boss.x+12,boss.y+12);
    boss.x=24+Math.random()*(LW-72); boss.y=28+Math.random()*90; puff(boss.x+12,boss.y+12);
  }
  if(--boss.shootT<=0){
    boss.shootT=80;
    const cx=boss.x+12, cy=boss.y+16, base=Math.atan2(player.y+8-cy,player.x+8-cx);
    [-0.35,0,0.35].forEach(off=>bolts.push({x:cx,y:cy,vx:Math.cos(base+off)*1.7,vy:Math.sin(base+off)*1.7,t:0}));
    tone(140,0.15,'sawtooth',0.05,0,-60);
  }
  const sb=player.atkT>6?swordBox():null;
  const bb={x:boss.x+4,y:boss.y+4,w:16,h:18};
  if(sb&&boss.hitId!==player.swingId&&rectHit(sb,bb)){
    boss.hitId=player.swingId; boss.hp--; boss.flash=10; SFX.bossHurt(); shake=4;
    if(boss.hp<=0){
      flags.bossDead=true; SFX.fanfare(); shake=12;
      for(let i=0;i<8;i++)puff(boss.x+Math.random()*24,boss.y+Math.random()*24);
      drops.push({t:'crystal',x:LW/2-8,y:LH/2-24,ttl:99999});
      mapOf()[13][7]='f'; mapOf()[13][8]='f'; boss=null; setTrack('dun'); return;
    }
  }
  const pb={x:player.x+2,y:player.y+4,w:12,h:11};
  if(rectHit(pb,bb))hurtPlayer(2,boss.x+8,boss.y+8);
  for(const b of bolts){
    b.x+=b.vx; b.y+=b.vy; b.t++;
    if(rectHit(pb,{x:b.x-3,y:b.y-3,w:6,h:6})){b.dead=true;hurtPlayer(2,b.x,b.y);}
    if(b.x<0||b.x>LW||b.y<0||b.y>LH||b.t>300)b.dead=true;
  }
  bolts=bolts.filter(b=>!b.dead);
}

/* ---------------- ドロップ ---------------- */
function updateDrops(){
  const pb={x:player.x+2,y:player.y+4,w:12,h:11};
  for(const d of drops){
    if(d.ttl<99999)d.ttl--;
    if(d.ttl<=0){d.dead=true;continue;}
    const sz=d.t==='crystal'?16:8;
    if(rectHit(pb,{x:d.x,y:d.y,w:sz,h:sz})){
      d.dead=true;
      if(d.t==='heart'){player.hp=Math.min(player.maxHp,player.hp+2);SFX.heart();}
      else if(d.t==='gem'){player.gems++;SFX.gem();}
      else if(d.t==='crystal'){player.crystals++;state='ending';fade=0;}
    }
  }
  drops=drops.filter(d=>!d.dead);
  for(const e of effects)e.t++; effects=effects.filter(e=>e.t<20);
}

/* ---------------- 描画 ---------------- */
function drawMap(){
  const m=mapOf(), wf=Math.floor(frame/24)%2, vf=Math.floor(frame/30)%2;
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    const t=m[y][x]; let img;
    if(t==='W')img=tileCache[wf?'W2':'W'];
    else if(t==='v')img=tileCache[vf?'v2':'v'];
    else if(t==='.')img=tileCache[(x+y)%2?'.':'.2'];
    else img=tileCache[t]||tileCache['.'];
    ctx.drawImage(img,x*16,y*16);
  }
  if(scr.area==='dun'){ ctx.fillStyle='rgba(8,4,20,0.22)'; ctx.fillRect(0,0,LW,LH); }
}
function shadow(cx,by,w){ ctx.fillStyle='rgba(0,0,0,0.22)';
  ctx.beginPath(); ctx.ellipse(cx,by,w,w*0.42,0,0,6.29); ctx.fill(); }
function drawTorch(tx,ty){
  const x=tx*16, y=ty*16, f=Math.floor(frame/6)%3;
  ctx.fillStyle='rgba(255,180,60,0.16)'; ctx.beginPath();
  ctx.arc(x+8,y+8,18+(f===1?2:0),0,6.29); ctx.fill();
  ctx.fillStyle='#3a2a18'; ctx.fillRect(x+6,y+9,4,5);
  ctx.fillStyle='#ff7a2a'; ctx.fillRect(x+5,y+4,6,6);
  ctx.fillStyle='#ffcf4a'; ctx.fillRect(x+6,y+3-(f===1?1:0),4,5);
  ctx.fillStyle='#fff2a0'; ctx.fillRect(x+7,y+2,2,3);
}
function drawSword(){
  if(player.atkT<=0)return;
  const p=player.atkT/14;
  ctx.save(); ctx.translate(player.x+8,player.y+9);
  const steel='#d8dce8', hilt='#e8c84a'; ctx.fillStyle=steel;
  if(player.dir==='down'){ctx.fillRect(-1,6,3,11);ctx.fillStyle=hilt;ctx.fillRect(-3,6,7,2);}
  if(player.dir==='up'){ctx.fillRect(-1,-17,3,11);ctx.fillStyle=hilt;ctx.fillRect(-3,-8,7,2);}
  if(player.dir==='right'){ctx.fillRect(6,-1,11,3);ctx.fillStyle=hilt;ctx.fillRect(6,-3,2,7);}
  if(player.dir==='left'){ctx.fillRect(-17,-1,11,3);ctx.fillStyle=hilt;ctx.fillRect(-8,-3,2,7);}
  if(p>0.6){ctx.fillStyle='rgba(255,255,255,0.5)'; const r=18*(1-p)+8; ctx.fillRect(-r/2,-r/2,r,1);}
  ctx.restore();
}
function drawEntities(){
  const key=scr.area+':'+scr.col+','+scr.row;
  (TORCHES[key]||[]).forEach(p=>drawTorch(p[0],p[1]));
  // 看板
  (SIGNS[key]||[]).forEach(s=>{ shadow(s.tx*16+8,s.ty*16+15,5); ctx.drawImage(signSpr,s.tx*16,s.ty*16-2); });
  // 宝箱
  (CHESTS[key]||[]).forEach((c,i)=>{ shadow(c.tx*16+8,c.ty*16+13,6);
    ctx.drawImage(chestOpened.has(key+'#'+i)?chestOpen:chestClosed,c.tx*16,c.ty*16-2); });
  // NPC
  (NPCS[key]||[]).forEach(n=>{ shadow(n.x+8,n.y+15,5);
    if(n.spr===fairyA){ctx.fillStyle='rgba(160,220,255,0.18)';ctx.beginPath();
      ctx.arc(n.x+8,n.y+7,10+Math.sin(frame/8)*2,0,6.29);ctx.fill();
      ctx.drawImage(Math.floor(frame/12)%2?fairyB:fairyA,n.x,n.y+Math.sin(frame/22)*2);}
    else ctx.drawImage(n.spr,n.x,n.y); });
  // ドロップ
  const bob=Math.sin(frame/10)*1.5;
  for(const d of drops){
    if(d.ttl<120&&Math.floor(frame/4)%2)continue;
    if(d.t==='heart')ctx.drawImage(heartSpr,d.x,d.y+bob*0.5);
    else if(d.t==='gem')ctx.drawImage(gemSpr,d.x,d.y+bob*0.5);
    else if(d.t==='crystal'){ ctx.fillStyle='rgba(122,216,255,0.25)';
      ctx.beginPath();ctx.arc(d.x+8,d.y+8+bob,12+Math.sin(frame/8)*2,0,6.29);ctx.fill();
      ctx.drawImage(crystalSpr,d.x,d.y+bob); }
  }
  // 敵
  const f2=Math.floor(frame/12)%2;
  for(const e of enemies){
    shadow(e.x+8,e.y+13,5);
    if(e.flash>0&&Math.floor(frame/2)%2)continue;
    const img=e.t==='slime'?(f2?slimeB:slimeA):e.t==='bat'?(f2?batB:batA):(f2?skelB:skelA);
    ctx.drawImage(img,Math.round(e.x),Math.round(e.y));
  }
  // ボス
  if(boss){
    shadow(boss.x+12,boss.y+22,11);
    if(!(boss.flash>0&&Math.floor(frame/2)%2)){
      ctx.fillStyle='rgba(120,40,200,0.18)';
      ctx.beginPath();ctx.arc(boss.x+12,boss.y+14,17+Math.sin(frame/7)*2,0,6.29);ctx.fill();
      ctx.drawImage(Math.floor(frame/14)%2?bossB:bossA,Math.round(boss.x),Math.round(boss.y));
    }
  }
  for(const b of bolts){
    ctx.fillStyle=b.t%6<3?'#8a3adf':'#c060ff'; ctx.fillRect(b.x-3,b.y-3,6,6);
    ctx.fillStyle='#2a1040';ctx.fillRect(b.x-1,b.y-1,3,3);
  }
  // プレイヤー
  shadow(player.x+8,player.y+15,5);
  if(!(player.invT>0&&Math.floor(frame/3)%2)){
    const fr=player.moving?Math.floor(player.anim/8)%2:0;
    ctx.drawImage(HERO_SPR[player.dir][fr],Math.round(player.x),Math.round(player.y));
  }
  drawSword();
  for(const e of effects){
    const r=e.t*0.9+2; ctx.fillStyle='rgba(240,240,255,'+(1-e.t/20)+')';
    ctx.fillRect(e.x-r,e.y-1,r*0.6,2);ctx.fillRect(e.x+r*0.4,e.y-1,r*0.6,2);
    ctx.fillRect(e.x-1,e.y-r,2,r*0.6);ctx.fillRect(e.x-1,e.y+r*0.4,2,r*0.6);
  }
}

/* 表示 */
function blit(){
  let sx=0, sy=0;
  if(shake>0){sx=(Math.random()-0.5)*shake;sy=(Math.random()-0.5)*shake;shake*=0.85;if(shake<0.5)shake=0;}
  dctx.fillStyle='#000'; dctx.fillRect(0,0,cv.width,cv.height); dctx.imageSmoothingEnabled=false;
  dctx.drawImage(buf,sx*SCALE,sy*SCALE,LW*SCALE,LH*SCALE);
}
function renderSlide(){
  const p=slide.t/slide.dur; let ox=0,oy=0,nx=0,ny=0;
  if(slide.dir==='up'){ oy=p*LH; ny=-LH+p*LH; }
  else if(slide.dir==='down'){ oy=-p*LH; ny=LH-p*LH; }
  else if(slide.dir==='left'){ ox=p*LW; nx=-LW+p*LW; }
  else { ox=-p*LW; nx=LW-p*LW; }
  dctx.fillStyle='#000'; dctx.fillRect(0,0,cv.width,cv.height); dctx.imageSmoothingEnabled=false;
  dctx.drawImage(snap,Math.round(ox)*SCALE,Math.round(oy)*SCALE,LW*SCALE,LH*SCALE);
  dctx.drawImage(buf,Math.round(nx)*SCALE,Math.round(ny)*SCALE,LW*SCALE,LH*SCALE);
}

  dctx.font=((bold===false?'':'bold ')+px+"px 'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif");

  dctx.fillStyle='rgba(0,0,0,0.6)'; dctx.fillText(str,x+2,y+2);
  dctx.fillStyle=color||'#fff'; dctx.fillText(str,x,y);
}

}
function drawEnding(){
  fade=Math.min(1,fade+0.01);
  dctx.fillStyle='#050512'; dctx.fillRect(0,0,cv.width,cv.height); dctx.globalAlpha=fade;
  dctx.save(); dctx.translate(cv.width/2-8*5,120+Math.sin(frame/40)*5); dctx.scale(5,5);
  dctx.drawImage(crystalSpr,0,0); dctx.restore();
  ['光晶のかけらを 取り戻した!','','だが かけらは まだ二つ、','闇の中に眠っている……。','','アレンの旅は 始まったばかり。']
    .forEach((ln,i)=>dtext(ln,cv.width/2,270+i*36,24,'#dce4ff','center'));
  dtext('THE END — DEMO VERSION',cv.width/2,530,22,'#ffe9a0','center');
  if(fade>=1&&Math.floor(frame/30)%2)dtext('ENTER でタイトルへ',cv.width/2,590,18,'#667','center');
  dctx.globalAlpha=1;
}

/* ---------------- リセット ---------------- */
const ORIG=JSON.parse(JSON.stringify({over:AREAS.over.screens,dun:AREAS.dun.screens}));
function buildMapsFresh(){
  for(const a in ORIG)for(const k in ORIG[a]) AREAS[a].screens[k]=ORIG[a][k].map(function(r){return r.slice();});
  wireArea('over');
}
function resetGame(){
  flags={}; chestOpened=new Set();
  Object.assign(player,{hp:6,maxHp:6,gems:0,keys:0,crystals:0,atkT:0,invT:0,anim:0,dir:'up',swingId:0});
  player.kb={x:0,y:0,t:0}; slide=null;
  buildMapsFresh();
  enterScreen('over',0,1,7*16+4,9*16,'up');
}

/* ---------------- メインループ ---------------- */
function update(){
  frame++;
  if(state==='title'){ if(pressed.start||pressed.atk){ state='intro'; introPage=0; SFX.gem(); } }
  else if(state==='intro'){
    if(pressed.start||pressed.atk){ introPage++; SFX.blip();
      if(introPage>=INTRO_PAGES.length){ resetGame(); state='play'; } }
  }
  else if(state==='play'){
    if(slide){ slide.t++; if(slide.t>=slide.dur)slide=null; }
    else if(dialog)updateDialog();
    else{ updatePlayer(); if(state==='play'){ updateEnemies(); updateBoss(); updateDrops(); } }
    updateMusic();
  }
  else if(state==='gameover'){ if(fade>0.5&&pressed.start){ state='title'; fade=0; } }
  else if(state==='ending'){ updateMusic(); setTrack('over'); if(fade>=1&&pressed.start){ state='title'; fade=0; } }
  if(pressed.mute)muted=!muted;
  for(const k in pressed)pressed[k]=false;
}
function render(){
  if(state==='title'){ drawTitle(); return; }
  if(state==='intro'){ drawIntro(); return; }
  if(state==='ending'){ drawEnding(); return; }
  ctx.fillStyle='#000'; ctx.fillRect(0,0,LW,LH);
  drawMap(); drawEntities();
  if(slide){ renderSlide(); drawHUD(); return; }
  blit(); drawHUD(); drawDialogBox();
  if(state==='gameover')drawGameOver();
}
function loop(){ update(); render(); requestAnimationFrame(loop); }
loop();
</script>
