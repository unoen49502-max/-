<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ドットピクロス</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scanlines"></div>

  <main class="app">
    <header class="titlebar">
      <h1 class="title">DOT PICROSS</h1>
      <p class="subtitle">お絵かきロジック</p>
    </header>

    <!-- パズル選択画面 -->
    <section id="select-screen" class="screen">
      <h2 class="screen-heading">SELECT PUZZLE</h2>
      <div id="puzzle-list" class="puzzle-list"></div>
    </section>

    <!-- ゲーム画面 -->
    <section id="game-screen" class="screen hidden">
      <div class="game-topbar">
        <button id="back-btn" class="btn btn-small">&lt; BACK</button>
        <div class="game-info">
          <span id="puzzle-name" class="puzzle-name">-</span>
          <span id="timer" class="timer">00:00</span>
        </div>
      </div>

      <div class="board-wrap">
        <div id="board" class="board"></div>
      </div>

      <div class="toolbar">
        <button id="mode-fill" class="btn mode-btn active">■ ぬる</button>
        <button id="mode-mark" class="btn mode-btn">✕ マーク</button>
        <button id="reset-btn" class="btn btn-warn">RESET</button>
      </div>
      <p class="hint">左クリック=現在のモード / 右クリックで✕マーク</p>
    </section>

    <!-- クリア画面 -->
    <div id="clear-overlay" class="overlay hidden">
      <div class="clear-box">
        <h2 class="clear-title">CLEAR!</h2>
        <div id="clear-art" class="clear-art"></div>
        <p id="clear-time" class="clear-time">TIME 00:00</p>
        <button id="clear-next" class="btn">次へ</button>
      </div>
    </div>
  </main>

  <script src="puzzles.js"></script>
  <script src="game.js"></script>
</body>
</html>
