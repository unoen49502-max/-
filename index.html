<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>メイのドット工房</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=9">
</head>
<body>
  <main class="app">
    <!-- ===== 起動画面（画面0） ===== -->
    <section id="title-screen">
      <div class="ts-statusbar">
        <div><span class="ts-dot">●</span>OFFLINE</div>
        <div>まもなく かいてん…</div>
      </div>

      <div class="ts-title-area">
        <div class="ts-logo">メイの<br>ドット工房</div>
        <div class="ts-subtitle-border">
          <div class="ts-subtitle-bar">— HAGURE MAY PICROSS ATELIER —</div>
        </div>
      </div>

      <div class="ts-avatar-wrap">
        <div class="ts-avatar-outer">
          <div class="ts-avatar-inner">
            <img src="assets/mei_bust.png" alt="はぐれメイ">
          </div>
        </div>
      </div>

      <div class="ts-name-pill-wrap">
        <div class="ts-name-pill-outer">
          <div class="ts-name-pill-inner">はぐれメイ</div>
        </div>
      </div>

      <div class="ts-buttons">
        <button class="ts-btn ts-btn-primary" id="btn-start-stream">
          <span>▶ はいしんを はじめる</span>
        </button>
        <button class="ts-btn ts-btn-secondary" id="btn-gallery">
          <span>こうぼうの かべ</span>
        </button>
      </div>

      <div class="ts-footer">© はぐれメイ / ver 0.3<br>タップおん が でます</div>
    </section>

    <!-- ===== セレクト画面（工房の壁） ===== -->
    <section id="select-screen" class="hidden">
      <div class="ss-statusbar">
        <div><span class="ss-dot">●</span>OFFLINE</div>
        <div>まもなく かいてん…</div>
      </div>

      <div class="ss-greet">
        <div class="ss-avatar-outer">
          <div class="ss-avatar-inner"><img src="assets/mei_bust.png" alt="はぐれメイ"></div>
        </div>
        <div class="ss-speech">
          <span class="ss-speech-name">はぐれメイ</span>
          <div class="ss-speech-border ss-n8">
            <div class="ss-speech-bar ss-n5">
              <div class="ss-speech-text js-speech">すきな えを えらんでね◆</div>
            </div>
          </div>
        </div>
      </div>

      <div class="ss-heading">こうぼうの かべ</div>

      <div class="ss-grid" id="puzzle-list"></div>
    </section>

    <!-- ===== ゲーム画面（美術館の部屋・スマホ主軸） ===== -->
    <section id="game-screen" class="hidden">
      <!-- ヘッダー -->
      <div class="gh">
        <span class="gh-logo">メイのドット工房</span>
        <span class="gh-right">
          <span class="gh-live"><span class="gh-ld"></span>LIVE</span>
          <span class="gh-timer"><span class="gh-clk">◷</span><span id="timer">00:00</span></span>
        </span>
      </div>

      <!-- キャラ帯 -->
      <div class="cband">
        <div class="cb-avatar-outer">
          <div class="cb-avatar-inner"><img src="assets/mei_bust.png" alt="はぐれメイ"></div>
        </div>
        <div class="cb-speech">
          <span class="cb-speech-name">はぐれメイ</span>
          <div class="cb-speech-border">
            <div class="cb-speech-bar">
              <div class="cb-speech-text js-speech">いっしょに かこうね◆</div>
            </div>
          </div>
        </div>
      </div>

      <!-- 進捗 -->
      <div class="prog">
        <div class="prog-row">
          <span class="prog-name" id="puzzle-name">-</span>
          <span class="prog-track"><span class="prog-fill" id="progress-bar"></span></span>
          <span class="prog-pct" id="progress-pct">0%</span>
        </div>
      </div>

      <!-- 盤面（不透明パネル＋アウトライン） -->
      <div class="board-wrap"><div id="board" class="board"></div></div>

      <!-- ツールバー -->
      <div class="toolbar">
        <div class="tb-modes">
          <button id="mode-fill" class="mode-btn active">
            <span class="mi"><span class="ico"><svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><rect x="3" y="3" width="14" height="14" fill="currentColor"/></svg></span>ぬる</span>
          </button>
          <button id="mode-mark" class="mode-btn">
            <span class="mi"><span class="ico"><svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="M4 4L16 16M16 4L4 16" stroke="currentColor" stroke-width="3.4" stroke-linecap="square" fill="none"/></svg></span>マーク</span>
          </button>
        </div>
        <div class="tb-round-row">
          <button id="btn-pause" class="round-btn" aria-label="きゅうけい"><span class="ri"><span class="ico">⏸</span></span></button>
          <button id="btn-reset" class="round-btn" aria-label="やりなおし"><span class="ri"><span class="ico">↻</span></span></button>
          <button id="btn-undo" class="round-btn" aria-label="もどす"><span class="ri"><span class="ico">↶</span></span></button>
          <button id="back-btn" class="back-btn"><span>＜ かべへ</span></button>
        </div>
        <div class="tb-hint-note">タップ=ぬる ／ ながおし=✕マーク</div>
      </div>
    </section>

    <!-- ===== クリア演出 ===== -->
    <div id="clear-overlay" class="overlay hidden">
      <div class="clear-box">
        <div id="clear-face" class="face face-happy big-face" aria-hidden="true"></div>
        <h2 class="clear-title">かんせい！</h2>
        <div id="clear-art" class="clear-art"></div>
        <p class="clear-msg">かべに かざったよ！</p>
        <p id="clear-time" class="clear-time">TIME 00:00</p>
        <button id="clear-next" class="btn">つぎへ</button>
      </div>
      <div id="confetti" class="confetti" aria-hidden="true"></div>
    </div>
  </main>

  <script src="puzzles.js?v=9"></script>
  <script src="game.js?v=9"></script>
</body>
</html>
